<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Jimmy Yao monogram">
  <style>
    :root { --paper: #f6f5f1; --ink: #151413; --accent: #c2410c; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #141312; --ink: #ecebe6; --accent: #fb7a45; }
    }
  </style>
  <rect width="64" height="64" rx="14" fill="var(--paper)"/>
  <text x="31" y="44" text-anchor="middle" fill="var(--ink)" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="500" letter-spacing="-2">JY</text>
  <circle cx="50" cy="42" r="3.2" fill="var(--accent)"/>
</svg>
